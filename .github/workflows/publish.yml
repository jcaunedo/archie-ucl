name: Publish @jcaunedo/archie-ucl

# Publishes only when the version in package.json isn't in the registry yet, so normal merges
# release nothing. Checking the registry (not the previous commit) means a version bump is still
# published when other commits land after it in the same push, and lets the first version publish.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Check whether this version is already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published. Nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION isn't published yet."
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Type-check
        if: steps.check.outputs.publish == 'true'
        run: npm run lint

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Publish to GitHub Packages
        if: steps.check.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check.outputs.publish == 'true'
        run: echo "Published @jcaunedo/archie-ucl@${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
